<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAD Master</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<header class="hdr">
  <img class="logo" src="img/logo.png" alt="">
  <div class="ttl">
    <div class="t1">CAD Master</div>
    <div class="t2" id="ctxLine"><span class="dot"></span>Connecting…</div>
  </div>
  <button class="avatar" id="avatarBtn" title="Account">?</button>
  <button class="ibtn" id="popoutBtn" title="Pop out / dock" data-icon="arrows-diagonal"></button>
  <button class="ibtn" id="menuBtn" title="Menu" data-icon="dots-vertical"></button>
</header>

<nav class="tabs">
  <button class="tab on" data-tab="chat">Chat</button>
  <button class="tab" data-tab="tasks">Tasks<span class="badge hidden" id="taskBadge"></span></button>
  <button class="tab" data-tab="details" title="The detailed process: commands, scripts and results">Details</button>
  <button class="tab" data-tab="terminal">Terminal</button>
  <button class="tab" data-tab="history">History</button>
  <span class="sp"></span>
  <button class="ibtn" id="newChatBtn" title="New chat" data-icon="plus"></button>
</nav>

<div class="updbar hidden" id="updBar"></div>

<section class="view" id="chatView">
  <div id="messages"></div>
  <div class="activity hidden" id="activity">
    <span class="gears" aria-hidden="true"><span class="g1" data-icon="settings"></span><span class="g2" data-icon="settings"></span></span>
    <span class="at">Getting started</span>
    <span class="hands hidden" title="Claude is working in SOLIDWORKS. Don't click in the model for a moment."><span data-icon="hand-stop"></span>hands off</span>
    <img class="thumb hidden" alt="" title="Latest model view">
    <span class="el"></span>
    <button class="ibtn" id="actDetails" title="See the detailed process" data-icon="list-details"></button>
  </div>
  <div class="cmp">
    <div class="menu hidden" id="palette"></div>
    <div class="ctx" id="ctxChips"></div>
    <textarea id="input" rows="2" placeholder="Ask CAD Master, or type / for commands"></textarea>
    <div class="row">
      <button class="chip" id="modeChip" title="Permission mode (Shift+Tab)"></button>
      <button class="chip" id="modelChip" title="Model"></button>
      <button class="chip" id="effortChip" title="Effort"></button>
      <span class="sp"></span>
      <button class="ibtn" id="viewBtn" title="Attach a screenshot of the SOLIDWORKS view" data-icon="camera"></button>
      <button class="ibtn" id="selBtn" title="Attach the current selection" data-icon="pointer"></button>
      <button class="ibtn" id="fileBtn" title="Attach a file or image" data-icon="paperclip"></button>
      <button class="send" id="sendBtn" title="Send (Enter)" data-icon="arrow-up"></button>
    </div>
  </div>
</section>

<section class="view hidden" id="tasksView"></section>

<section class="view hidden" id="detailsView"><div id="detailLog"></div></section>

<section class="view hidden" id="termView">
  <div class="termbar">
    <button class="btn sm" id="termNew"><span data-icon="terminal-2"></span>Start Claude Code</button>
    <button class="btn sm" id="termResume" title="Continue the current chat in the terminal"><span data-icon="history"></span>Open this chat</button>
    <button class="btn sm" id="termStop"><span data-icon="player-stop"></span>Stop</button>
    <span class="sp"></span><span id="termTitle"></span>
  </div>
  <div id="term"></div>
</section>

<section class="view hidden" id="historyView"></section>

<div class="statusline"><span id="statusLeft"></span><span class="sp"></span><span id="statusRight"></span></div>

<div id="overlay" class="overlay hidden"></div>
<div id="toasts"></div>
<div id="lightbox" class="hidden"><img alt=""></div>
<div id="dropzone" class="hidden"><div><span data-icon="drag-drop"></span><b>Drop to attach</b><small>Pictures, sketches, STEP, IGES, STL, SOLIDWORKS files, PDFs</small></div></div>

<script src="js/icons.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="js/bridge.js"></script>
<script src="js/mock.js"></script>
<script src="js/app.js"></script>
</body>
</html>
